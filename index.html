<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Second-Hand PC Hub</title>
    <meta
      name="description"
      content="Friendly GitHub Pages site for second-hand PC guides, reviews, and research notes."
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.2/dist/purify.min.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">Second-hand PC research</p>
          <h1>Second-Hand PC Hub</h1>
        </div>
        <div class="header-actions">
          <label class="search-box" aria-label="Search site & catalog">
            <span>Search</span>
            <input id="searchInput" type="search" placeholder="Search laptops, specs, catalog (e.g. i7, 32GB, ThinkPad)..." />
          </label>
          <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark / light theme">
            <span id="themeIcon">🌙</span>
            <span class="theme-text">Dark</span>
          </button>
        </div>
      </header>

      <nav class="filter-bar" aria-label="View switcher">
        <button class="filter-btn active catalog-nav-btn" data-filter="catalog" type="button">💻 Laptop Catalog Finder</button>
        <button class="filter-btn" data-filter="full-catalog" type="button">📋 Full Catalog</button>
      </nav>

      <main class="content-layout">
        <aside class="sidebar">
          <div id="catalogFiltersCard" class="sidebar-card">
            <div class="sidebar-card-header">
              <h2>Catalog Filters</h2>
              <button id="toggleFiltersBtn" class="mobile-filter-toggle" type="button" aria-expanded="true">
                <span class="toggle-text">Filters</span> <span class="toggle-arrow">▴</span>
              </button>
            </div>

            <div id="catalogFilterFields" class="filter-fields-wrapper">
              <div class="filter-group">
                <label for="storeFilter">Store</label>
                <select id="storeFilter" class="filter-select">
                  <option value="all">All Stores</option>
                  <option value="IT Outlet">IT Outlet</option>
                  <option value="Ecology Computers">Ecology Computers</option>
                  <option value="LaptopTech LTS">LaptopTech LTS</option>
                  <option value="Recomp Computers">Recomp Computers</option>
                </select>
              </div>

              <div class="filter-group">
                <label for="brandFilter">Brand</label>
                <select id="brandFilter" class="filter-select">
                  <option value="all">All Brands</option>
                  <option value="Lenovo">Lenovo</option>
                  <option value="Dell">Dell</option>
                  <option value="HP">HP</option>
                  <option value="Apple">Apple</option>
                  <option value="Asus">Asus</option>
                  <option value="Acer">Acer</option>
                  <option value="Microsoft">Microsoft</option>
                </select>
              </div>

              <div class="filter-group filter-group-slider">
                <div class="slider-header-row">
                  <div class="slider-label-with-mode">
                    <label for="priceSlider">Price Budget</label>
                    <div class="price-mode-pills" role="group" aria-label="Price filter mode">
                      <button type="button" class="price-mode-btn active" data-mode="max" title="Show laptops up to this price">Up to</button>
                      <button type="button" class="price-mode-btn" data-mode="min" title="Show laptops starting from this price">From</button>
                    </div>
                  </div>
                  <span id="priceDisplay" class="slider-value-badge" title="Click to reset price filter">Any Price</span>
                </div>
                <div class="slider-wrapper">
                  <input
                    type="range"
                    id="priceSlider"
                    class="price-range-slider"
                    min="800"
                    max="5000"
                    step="50"
                    value="5000"
                    aria-label="Price budget slider"
                  />
                </div>
                <div class="slider-ticks">
                  <span>800 ₪</span>
                  <span>2,500 ₪</span>
                  <span>5,000 ₪ (Any)</span>
                </div>
              </div>

              <div class="filter-group">
                <label for="cpuGenFilter">CPU Gen</label>
                <select id="cpuGenFilter" class="filter-select">
                  <option value="all">All Generations</option>
                  <optgroup label="Generations (& Up / & Down)">
                    <option value="12-up">⚡ 12th Gen & Up</option>
                    <option value="11-up">🚀 11th Gen & Up</option>
                    <option value="10-up">💼 10th Gen & Up</option>
                    <option value="8-up">💻 8th Gen & Up (Win 11)</option>
                    <option value="11-down">⏳ 11th Gen & Down</option>
                    <option value="10-down">⏳ 10th Gen & Down</option>
                    <option value="8-down">⏳ 8th Gen & Down</option>
                  </optgroup>
                  <optgroup label="Specific Family / Brand">
                    <option value="12+">⚡ 12th & 13th Gen (Only)</option>
                    <option value="11">🚀 11th Gen (Only)</option>
                    <option value="10">💼 10th Gen (Only)</option>
                    <option value="8">💻 8th / 9th Gen (Only)</option>
                    <option value="older">Older (4th - 7th Gen)</option>
                    <option value="apple">Apple Silicon (M1/M2)</option>
                    <option value="amd">AMD Ryzen</option>
                  </optgroup>
                </select>
              </div>

              <div class="filter-group">
                <label for="ramFilter">RAM</label>
                <select id="ramFilter" class="filter-select">
                  <option value="0">Any RAM</option>
                  <optgroup label="Capacity (& Up)">
                    <option value="8">8 GB & Up</option>
                    <option value="16">16 GB & Up (Recommended)</option>
                    <option value="32">32 GB & Up (Power User)</option>
                    <option value="64">64 GB & Up (Workstation)</option>
                  </optgroup>
                  <optgroup label="Capacity (& Down)">
                    <option value="8-down">8 GB & Down (Budget Basic)</option>
                    <option value="16-down">16 GB & Down</option>
                    <option value="32-down">32 GB & Down</option>
                  </optgroup>
                  <optgroup label="Exact Capacity">
                    <option value="8-exact">8 GB (Exact)</option>
                    <option value="16-exact">16 GB (Exact)</option>
                    <option value="32-exact">32 GB (Exact)</option>
                  </optgroup>
                </select>
              </div>

              <div class="filter-group">
                <label for="storageFilter">Storage (SSD)</label>
                <select id="storageFilter" class="filter-select">
                  <option value="0">Any Storage</option>
                  <optgroup label="Capacity (& Up)">
                    <option value="256">💾 256 GB & Up</option>
                    <option value="512">💾 512 GB & Up (Recommended)</option>
                    <option value="1000">💾 1 TB & Up (Large Storage)</option>
                  </optgroup>
                  <optgroup label="Capacity (& Down)">
                    <option value="256-down">💾 256 GB & Down (Budget Basic)</option>
                    <option value="512-down">💾 512 GB & Down</option>
                  </optgroup>
                  <optgroup label="Exact Capacity">
                    <option value="256-exact">256 GB (Exact)</option>
                    <option value="512-exact">512 GB (Exact)</option>
                    <option value="1000-exact">1 TB (Exact)</option>
                  </optgroup>
                </select>
              </div>

              <div class="filter-group">
                <label for="formFilter">Type / Screen</label>
                <select id="formFilter" class="filter-select">
                  <option value="all">All Types</option>
                  <option value="2in1">2-in-1 / Touchscreen</option>
                  <option value="clamshell">Clamshell Standard</option>
                </select>
              </div>

              <div class="filter-group">
                <label for="screenFilter">Screen Size</label>
                <select id="screenFilter" class="filter-select">
                  <option value="all">All Sizes</option>
                  <optgroup label="Size Range (& Up / & Down)">
                    <option value="14-up">📏 14.0" & Up (Medium to Large)</option>
                    <option value="14-down">📏 14.0" & Down (Compact to Medium)</option>
                    <option value="15-up">🖥️ 15.0" & Up (Large Display)</option>
                    <option value="13.5-down">📱 13.5" & Down (Ultra-Portable)</option>
                    <option value="15.6-down">🖥️ 15.6" & Down</option>
                    <option value="13.3-up">💻 13.3" & Up</option>
                  </optgroup>
                  <optgroup label="Exact Formats">
                    <option value="14.0">💻 14.0" (Standard Ultra)</option>
                    <option value="13.3">💻 13.3" (Compact)</option>
                    <option value="15.6">🖥️ 15.6" (Large Productivity)</option>
                  </optgroup>
                </select>
              </div>

              <div class="filter-group">
                <label for="weightFilter">Weight</label>
                <select id="weightFilter" class="filter-select">
                  <option value="0">Any Weight</option>
                  <optgroup label="Portable (& Down)">
                    <option value="1.3">🪶 1.3 kg & Down (Featherlight)</option>
                    <option value="1.5">💻 1.5 kg & Down (Portable Ultra)</option>
                    <option value="1.8">⚖️ 1.8 kg & Down (Everyday Carry)</option>
                    <option value="2.0">🏋️ 2.0 kg & Down</option>
                  </optgroup>
                  <optgroup label="Workstation / Heavier (& Up)">
                    <option value="1.5-up">🏢 1.5 kg & Up</option>
                    <option value="1.8-up">🏢 1.8 kg & Up (Workstation / Heavy)</option>
                    <option value="2.0-up">🏢 2.0 kg & Up (Heavy Workstation)</option>
                  </optgroup>
                </select>
              </div>

              <div class="filter-group">
                <label for="batteryFilter">Battery</label>
                <select id="batteryFilter" class="filter-select">
                  <option value="0">Any Battery</option>
                  <optgroup label="Capacity (& Up)">
                    <option value="45">🔋 45 Wh & Up</option>
                    <option value="50">🔋 50 Wh & Up (Standard Business+)</option>
                    <option value="55">🔋 55 Wh & Up (Long Battery)</option>
                    <option value="65">⚡ 65 Wh & Up (High Capacity)</option>
                  </optgroup>
                  <optgroup label="Capacity (& Down)">
                    <option value="45-down">🪶 45 Wh & Down</option>
                    <option value="50-down">🪶 50 Wh & Down (Standard / Ultralight)</option>
                    <option value="55-down">🔋 55 Wh & Down</option>
                  </optgroup>
                </select>
              </div>

              <div class="filter-group">
                <label for="upgradabilityFilter">Upgradability</label>
                <select id="upgradabilityFilter" class="filter-select">
                  <option value="0">Any Rating</option>
                  <optgroup label="Modular (& Up)">
                    <option value="7">🟢 Highly Upgradable (7+ & Up)</option>
                    <option value="8">🟢 Excellent Upgradability (8+ & Up)</option>
                    <option value="9">🟢 Fully Modular (9+ & Up)</option>
                  </optgroup>
                  <optgroup label="Thin Ultrabook (& Down)">
                    <option value="5-down">🟠 Soldered RAM / Ultrabook (5 & Down)</option>
                    <option value="7-down">🟡 Semi-Modular & Down (7 & Down)</option>
                  </optgroup>
                </select>
              </div>

              <div class="filter-group">
                <label for="sortFilter">Sort By</label>
                <select id="sortFilter" class="filter-select">
                  <option value="value-desc" selected>🏆 Best Value (Specs per ₪)</option>
                  <option value="price-asc">Price: Low to High</option>
                  <option value="price-desc">Price: High to Low</option>
                  <option value="weight-asc">Weight: Light to Heavy</option>
                  <option value="battery-desc">Battery: High to Low</option>
                  <option value="screen-desc">Screen Size: Large to Small</option>
                  <option value="upgrade-desc">Upgradability Score</option>
                  <option value="ram-desc">RAM Capacity</option>
                </select>
              </div>

              <button id="resetFiltersBtn" class="reset-filters-btn" type="button">🔄 Reset Filters</button>
            </div>
          </div>

          <div id="documentSidebarCard" class="sidebar-card hidden">
            <h2 id="documentSidebarTitle">Catalog Sections</h2>
            <div id="tabList" class="tab-list" role="tablist" aria-label="Catalog store sections"></div>
          </div>

          <div class="sidebar-card mini-stats">
            <h3>Quick facts</h3>
            <ul>
              <li>Live multi-store laptop database</li>
              <li>Instant spec & price filter engine</li>
              <li>Full market research & stock audits</li>
            </ul>
          </div>
        </aside>

        <section class="document-panel">
          <div id="statusBar" class="status-bar" aria-live="polite"></div>
          <div id="catalogContent" class="catalog-view" aria-live="polite"></div>
          <article id="documentContent" class="markdown-body hidden" aria-live="polite"></article>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
