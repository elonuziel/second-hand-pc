name: Live Market Scraper & Catalog Audit

on:
  schedule:
    # Run once daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      store:
        description: 'Specific store to scrape (or "all")'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  scrape:
    # Note: Use 'self-hosted' to run on your local/home machine (residential IP) for 100% Cloudflare bypass,
    # or use 'ubuntu-latest' with curl_cffi / residential proxy secret.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3
          # curl_cffi provides modern Chrome TLS/JA3/JA4 fingerprint impersonation to bypass Cloudflare
          pip install curl_cffi || echo "curl_cffi optional install fallback"

      - name: Scrape Refurbished Laptops Catalog
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            python3 scraper.py --ai --csv
          else
            python3 scraper.py --csv
          fi
          python3 enrich_specs.py

      - name: Scrape Refurbished Mobile Catalog
        env:
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
        run: |
          python3 mobile_scraper.py --csv

      - name: Run Catalog Health Tests
        run: |
          python3 -m unittest test_catalog.py
          python3 -m unittest test_mobile_catalog.py

      - name: Upload Catalog Artifacts Backup
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-catalogs-backup
          path: |
            full_catalog.md
            scraped_laptops.json
            scraped_laptops.csv
            full_mobile_catalog.md
            scraped_mobile.json
            scraped_mobile.csv
          if-no-files-found: warn

      - name: Commit and Push Updated Catalogs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scraped_laptops.json scraped_laptops.csv full_catalog.md \
                  scraped_mobile.json scraped_mobile.csv full_mobile_catalog.md
          if git diff --staged --quiet; then
            echo "No changes in catalogs to commit."
          else
            git commit -m "chore(catalog): auto-update refreshed products catalog [skip ci]"
            git push
          fi
