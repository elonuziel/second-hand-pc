name: Live Laptop Market Audit

on:
  workflow_dispatch:
  schedule:
    # Run once every 3 days
    - cron: '0 0 */3 * *'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests urllib3

      - name: Run Master Scraper with Groq AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 scraper.py --ai --csv

      - name: Commit and push updated catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add summary.md scraped_laptops.json scraped_laptops.csv
          if git diff --staged --quiet; then
            echo "No changes in catalog."
          else
            git commit -m "chore(audit): auto-update live laptop catalog & summaries"
            git push
          fi

